

services:
  nginx:
    image: nginx:latest
    container_name: nginx-container
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf 
    networks:
      - rabbit_net

  jenkins:
    image: jenkins/jenkins:latest
    container_name: jenkins-container
    restart: always
    ports:
      - "8080:8080" 
      - "50000:50000"
    volumes:
      - ./jenkins-data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - /usr/bin/docker:/usr/bin/docker
    networks:
      - rabbit_net
  
  jenkins-agent:
    image: jenkins/ssh-agent:jdk11
    container_name: jenkins-agent
    restart: always
    environment:
      - JENKINS_AGENT_SSH_PUBKEY=ssh-rsa  mendel@mendel-Latitude-7420
    depends_on:
      - jenkins
  
  registry:
    image: registry:2
    container_name: registry-container
    restart: always
    ports:
      - "5000:5000"
    volumes:
      - ./registry-data:/var/lib/registry
    networks:
      - rabbit_net

networks:
  rabbit_net: 
    external: true
